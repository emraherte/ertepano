[workspace]
resolver = "2"
members = ["core", "service", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Erte"]
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
windows = "0.61"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
