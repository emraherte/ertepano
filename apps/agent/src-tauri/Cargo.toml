[package]
name = "ertepano_agent"
version = "0.1.0"
description = "ErtePano Ajan - kurumsal ekran duyurulari ve IT envanteri"
authors = ["Erte"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# native-tls = Windows SChannel (kurumsal iç CA'ya Windows sertifika deposu üzerinden güvenir)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy", "charset"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sysinfo = "0.33"
ed25519-dalek = "2"
base64 = "0.22"
local-ip-address = "0.6"
mac_address = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
