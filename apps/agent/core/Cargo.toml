[package]
name = "ertepano_core"
description = "ErtePano ajan çekirdeği: yapılandırma, kayıt, WebSocket istemcisi, imza doğrulama, telemetri"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
# native-tls = Windows SChannel (kurumsal iç CA'ya Windows sertifika deposu üzerinden güvenir)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy", "charset"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# mTLS: istemci sertifikası (PKCS#12) ile TLS bağlayıcı — reqwest ve WebSocket aynı bağlayıcıyı kullanır
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sysinfo = "0.33"
ed25519-dalek = "2"
base64 = "0.22"
local-ip-address = "0.6"
mac_address = "1"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
] }
